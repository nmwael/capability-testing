quarkus.index-dependency.alerting.group-id=com.example
quarkus.index-dependency.alerting.artifact-id=alerting
quarkus.index-dependency.publication.group-id=com.example
quarkus.index-dependency.publication.artifact-id=publication
# Bind to all interfaces so the dev server is reachable through container port
# forwarding (localhost-only binds are invisible outside the container).
quarkus.http.host=0.0.0.0
# Dev only: let the Vite dev/preview server call this API cross-origin.
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173,http://localhost:4173
%dev.quarkus.http.cors.methods=GET,POST,OPTIONS
%dev.quarkus.http.cors.headers=content-type,accept
