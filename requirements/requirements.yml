# Requirement registry — what this repository must do, at the level below a capability.
#
# ID format: REQ-<LANE>-<nnn>, where LANE is PUB | ALERT | FRONT | DOCS and nnn is
# allocated once and never reused. A deleted requirement is retired, not recycled.
#
# The relationship is stored in ONE direction: every requirement names exactly one
# `capability:` from capabilities/capabilities.yml. The inverse ("which requirements
# cover this capability") is derived by scripts/verify-traceability.mjs, never stored
# here — a second writer would drift.
#
# One requirement per (capability, lane) pair that appears in a capability's
# `verified_by:`, so a capability verified in two lanes carries one requirement in
# each. Scenario coverage lives in the feature files: every scenario carries
# @scenario:SC-<LANE>-<nnn> and @req:<id>, and Git remains the source of truth for
# both the Gherkin and the tags.

