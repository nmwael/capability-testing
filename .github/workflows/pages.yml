name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runs the tests so the capability report is built from real results, then
  # hands the generated page to `build` as an artifact.
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: mvn -B -q test
      - name: Frontend tests
        working-directory: frontend
        run: >-
          mkdir -p reports && npm ci &&
          npm run test:unit -- --reporter=junit --outputFile=reports/junit.xml
          --coverage --coverage.reporter=json-summary --coverage.reporter=text
      - name: Mutation testing
        working-directory: backend
        run: >-
          mvn -B -Ppit test-compile
          org.pitest:pitest-maven:mutationCoverage
      - name: Capability to test coverage report
        run: >-
          node scripts/coverage-report.js
          --surefire 'backend/**/target/surefire-reports/TEST-*.xml'
          --vitest frontend/reports/junit.xml
          --cucumber 'backend/**/cucumber-junit.xml'
          --jacoco 'backend/**/target/site/jacoco/jacoco.xml'
          --frontend-coverage frontend/coverage/coverage-summary.json
          --pit 'backend/*/target/pit-reports/mutations.xml'
          --out docs/coverage
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: capability-report
          path: docs/coverage

  build:
    needs: report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download capability report
        uses: actions/download-artifact@v4
        with:
          name: capability-report
          path: docs/coverage
      - uses: actions/configure-pages@v4
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs/
          destination: ./out
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
