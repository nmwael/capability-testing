name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Publishing a check run needs checks: write. Naming contents: read explicitly
# matters because setting a permissions block replaces the implicit defaults, and
# actions/checkout needs contents: read.
permissions:
  contents: read
  checks: write

jobs:
  traceability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/verify-capabilities.js
      - run: node scripts/check-docs.js
      # Capability matrix + progress in the job summary. Test failures are left to
      # mikepenz/action-junit-report in each lane — this reports the specs.
      - name: Capability report
        if: always()
        run: node scripts/capability-report.js --summary "$GITHUB_STEP_SUMMARY"
      # Unified capability report: combine capability specs with test results and
      # @todo counts from feature files.
      - name: Unified capability report
        if: always()
        run: node scripts/capability-report.js --surefire "backend/**/target/surefire-reports/TEST-*.xml" --vitest "frontend/reports/junit.xml" --summary "$GITHUB_STEP_SUMMARY"

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      # Surefire already writes backend/*/target/surefire-reports/TEST-*.xml;
      # the action reads that and posts counts + failures to the job summary and
      # a check run. No reporting code of our own.
      - name: Maven test
        working-directory: backend
        run: mvn -B -q test
      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: 'Backend tests'
          report_paths: 'backend/**/target/surefire-reports/TEST-*.xml'
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/*/target/site/jacoco/index.html backend/*/target/site/jacoco/jacoco.xml
          retention-days: 14

  mention-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check for @-mentions in PR title/body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr view "$PR_NUMBER" --json title,body --jq '.title + "\n" + .body' > /tmp/pr.txt
          if grep -En '@[A-Za-z0-9_-]+' /tmp/pr.txt; then
            echo "::error::PR title or body contains an @-mention. Remove @-mentions from GitHub posts (see AGENTS.md GitHub Tracker Discipline)."
            exit 1
          fi
          echo "No @-mentions found in PR title/body."

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npx depcruise src --config .depcruiser.js
      # vitest's built-in junit reporter emits the same schema as Surefire, so the
      # one action covers both lanes. This also puts the unit tests into CI, which
      # the frontend lane did not run before.
      - name: Frontend tests
        working-directory: frontend
        run: mkdir -p reports && npm run test:unit -- --reporter=junit --outputFile=reports/junit.xml
      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: 'Frontend tests'
          report_paths: 'frontend/reports/junit.xml'
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/index.html frontend/coverage/coverage-final.json
          retention-days: 14

  playwright-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - working-directory: frontend
        run: npm ci
      - name: Playwright E2E tests
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
