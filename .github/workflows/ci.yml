name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write

jobs:
  traceability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/verify-capabilities.js
      - run: node scripts/check-docs.js
      - name: Capability report
        if: always()
        run: node scripts/capability-report.js --summary "$GITHUB_STEP_SUMMARY"
      - name: Unified capability report
        if: always()
        run: node scripts/capability-report.js --surefire "backend/**/target/surefire-reports/TEST-*.xml" --vitest "frontend/reports/junit.xml" --summary "$GITHUB_STEP_SUMMARY"

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Maven test
        working-directory: backend
        run: mvn -B -q test
      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: 'Backend tests'
          report_paths: 'backend/**/target/surefire-reports/TEST-*.xml'
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/*/target/site/jacoco/index.html backend/*/target/site/jacoco/jacoco.xml
          retention-days: 14

  mention-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for @-mentions in PR title/body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr view "$PR_NUMBER" --json title,body --jq '.title + "\n" + .body' > /tmp/pr.txt
          if grep -En '@[A-Za-z0-9_-]+' /tmp/pr.txt; then
            echo "::error::PR title or body contains an @-mention. Remove @-mentions from GitHub posts (see AGENTS.md GitHub Tracker Discipline)."
            exit 1
          fi
          echo "No @-mentions found in PR title/body."

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npx depcruise src --config .depcruiser.js
      - name: Frontend tests
        working-directory: frontend
        run: mkdir -p reports && npm run test:unit -- --reporter=junit --outputFile=reports/junit.xml
      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: 'Frontend tests'
          report_paths: 'frontend/reports/junit.xml'
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/index.html frontend/coverage/coverage-final.json
          retention-days: 14

  coverage-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Backend tests + coverage
        working-directory: backend
        run: mvn -B -q test
      - name: Frontend tests + coverage
        working-directory: frontend
        run: mkdir -p reports && npm run test:unit -- --reporter=junit --outputFile=reports/junit.xml
      - name: Generate capability coverage report
        run: |
          node scripts/capability-report.js \
            --capabilities capabilities/capabilities.yml \
            --backend-coverage backend/target/site/jacoco/jacoco.xml \
            --frontend-coverage frontend/coverage/coverage-final.json \
            --surefire "backend/**/target/surefire-reports/TEST-*.xml" \
            --vitest "frontend/reports/junit.xml" \
            --out coverage-report
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

  pages:
    runs-on: ubuntu-24.04
    needs: [coverage-report]
    steps:
      - uses: actions/checkout@v4
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: coverage-report
