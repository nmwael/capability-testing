<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }} — Capability Contract</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:0;color:#1b1f23;line-height:1.5}
.topnav{position:sticky;top:0;z-index:100;background:#1b1f23;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem;border-bottom:1px solid #30363d}
.topnav a{color:#c9d1da;text-decoration:none;padding:.2rem .6rem;border-radius:4px;font-size:.88rem}
.topnav a:hover,.topnav a:focus{background:#30363d;color:#fff}
.topnav a.active{background:#238636;color:#fff}
.topnav .nav-spacer{flex:1}
main{max-width:72rem;padding:1.5rem}
h1{margin:.5rem 0 .5rem 0;font-size:1.75rem}
h2{margin:1.5rem 0 .75rem 0;font-size:1.35rem;border-bottom:1px solid #e1e4e8;padding-bottom:.3rem}
h3{margin:1rem 0 .5rem 0;font-size:1.1rem}
p{margin:.75rem 0}
.meta{color:#57606a;font-size:.9rem;margin-top:0}
a{color:#0969da;text-decoration:none}
a:hover{text-decoration:underline}
.summary{display:flex;gap:1.5rem;margin:1.5rem 0;flex-wrap:wrap}
.summary div{background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:.75rem 1rem;min-width:120px}
.summary strong{display:block;font-size:1.4rem}
table{width:100%;border-collapse:collapse;margin:1rem 0}
caption{text-align:left;font-weight:600;padding:.5rem 0;font-size:1.1rem;color:#0969da}
th,td{border:1px solid #d0d7de;padding:.4rem .6rem;text-align:left;vertical-align:top;font-size:.92rem}
th{background:#f6f8fa}
code{background:#f6f8fa;padding:.1rem .3rem;border-radius:3px;font-size:.88em}
.pass{color:#116329;font-weight:600}
.failure{color:#b42318;font-weight:600}
.skipped{color:#9a6700;font-weight:600}
.none{color:#b42318;font-style:italic}
.cap-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem}
.card{border:1px solid #d0d7de;border-radius:6px;padding:1rem;margin:1rem 0;background:#fff}
.card h2{margin-top:0;font-size:1.2rem}
.card h2 a{color:#0969da;text-decoration:none}
.card h2 a:hover{text-decoration:underline}
.card .meta{font-size:.85rem}
.card p{margin:.5rem 0}
footer{margin-top:2rem;padding-top:1rem;border-top:1px solid #e1e4e8;color:#57606a;font-size:.85rem}
.github-link{color:#57606a;font-size:.75rem;text-decoration:none;margin-left:.5rem}
.github-link:hover{color:#0969da;text-decoration:underline}
</style>
</head>
<body>
<nav class="topnav">
  <a href="{{ site.baseurl }}/">Home</a>
  <a href="{{ site.baseurl }}/capabilities">Capabilities</a>
  <a href="{{ site.baseurl }}/reports">CI &amp; Reports</a>
  <a href="{{ site.baseurl }}/governance">Governance</a>
  <a href="{{ site.baseurl }}/coverage/">Coverage</a>
  <span class="nav-spacer"></span>
  <a href="https://github.com/nmwael/capability-testing" class="github-link" target="_blank" rel="noopener">GitHub repo ↗</a>
</nav>
<main>
{{ content }}
</main>
<footer>
Generated from <a href="https://github.com/nmwael/capability-testing/blob/main/docs/{{ page.path }}">source</a> &middot; <a href="{{ site.baseurl }}/coverage/">View capability coverage report</a>
</footer>
</body>
</html>
