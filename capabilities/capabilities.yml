capabilities:
  - id: alert.publish
    intent: "Publish an alert as a CAP v1.2 message that validates against the OASIS schema"
    owner: publication
    status: active
    lifecycle_state: active
    since: 1.0.0
    verified_by:
      - type: integration_test
        ref: "AlertPublishIT"
        coverage: 95
        mutation_score: 85
      - type: bdd_feature
        ref: "features/publication/alert-publish.feature"
        scenarios: ["SC-PUB-001", "SC-PUB-002", "SC-PUB-003", "SC-PUB-004", "SC-PUB-005", "SC-PUB-006", "SC-PUB-007"]

  - id: alert.route
