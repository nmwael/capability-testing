capabilities:
  - id: alert.publish
    intent: "Publish an alert as a CAP v1.2 message that validates against the OASIS schema"
    owner: publication
    status: active
    since: 1.0.0
    verified_by:
      - "AlertPublishIT"                          # backend integration test class
      - "features/publication/alert-publish.feature"

  - id: alert.route
    intent: "Route a CAP alert by its severity, urgency and certainty"
    owner: alerting
    status: active
    since: 1.0.0
    verified_by:
      - "AlertRouteIT"
      - "features/alerting/alert-route.feature"

  - id: alert.rule-design
    intent: "Draw routing rules as a React Flow graph; compile and execute them in Drools"
    owner: publication
    status: active
    since: 1.0.0
    verified_by:
      - "AlertRuleDesignIT"
      - "features/publication/alert-rule-design.feature"    # compile + execute (Quarkus/Cucumber/Drools)
      - "features/frontend/alert-rule-designer.feature"     # React Flow authoring surface (vitest)

  - id: alert.rule-edit
    intent: "Edit a saved routing rule graph in the designer and exchange it with the backend as JSON"
    owner: publication
    status: active
    since: 1.0.0
    verified_by:
      - "features/frontend/alert-rule-edit.feature"         # designer: load, edit, post JSON (vitest)
      - "features/publication/alert-rule-edit.feature"      # endpoint: accept, replace, echo JSON

  - id: alert.flow
    intent: "Show an alert's distribution as a React Flow canvas"
    owner: publication
    status: active
    since: 1.0.0
    verified_by:
      - "features/publication/alert-flow.feature"          # the distribution endpoint (JSON)
      - "features/frontend/alert-flow.feature"             # React Flow canvas (vitest)

  - id: alert.cap-fields
    intent: "List every CAP v1.2 attribute with its type and valid values, and drive the rule designer's condition fields from the schema"
    owner: publication
    status: active
    since: 1.0.0
    verified_by:
      - "features/frontend/cap-field-catalogue.feature"    # field catalogue + XSD drift guard (vitest)

  - id: docs.onboarding
    intent: "Create entrypoint README.md, optional ONBOARDING.md, inline mermaid diagrams, consolidate stale docs, remove generated Playwright artifacts"
    owner: docs
    status: draft
    since: 1.1.0
    verified_by:
      - "features/docs/onboarding.feature"
    plans:
      - "186: GitHub Tracker Integration + Doc Freeze"
